<!doctype html><html><head><meta charset="utf-8"><title>Group browser</title><style>
*{box-sizing:border-box}body{margin:0;background:#101821;color:#c8dfdf;font:14px sans-serif;overflow:hidden}header{height:38px;display:flex;gap:6px;padding:5px}input{flex:1;min-width:0;background:#223039;color:white;border:1px solid #42636c;padding:4px}button{background:#28434b;border:0;color:white;padding:4px 12px}#view{display:block;width:100%;height:calc(100vh - 60px);object-fit:contain;outline:none}footer{height:22px;padding:3px 8px;font-size:12px}
</style></head><body><header><button id="reload">↻</button><input id="address" placeholder="https://…"><button id="go">Go</button></header><img id="view" tabindex="0" draggable="false"><footer id="status">Persistent browser · this page stays running outside Minecraft</footer><script>
const parts=location.pathname.split('/'),token=parts[1],group=parts[3],base='/'+token+'/',view=document.querySelector('#view'),address=document.querySelector('#address'),status=document.querySelector('#status');let stopped=false,queue=Promise.resolve();
function send(method,params){queue=queue.catch(()=>{}).then(async()=>{const r=await fetch(base+'input/'+group,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method,params})});const d=await r.json();if(d.error)status.textContent=d.error;});return queue;}
async function frame(){if(stopped)return;try{const r=await fetch(base+'frame/'+group);if(!r.ok)throw Error('Browser reconnecting…');const blob=await r.blob(),old=view.src;view.src=URL.createObjectURL(blob);if(old.startsWith('blob:'))URL.revokeObjectURL(old);}catch(e){status.textContent=e.message;}setTimeout(frame,160);}frame();
async function info(){try{const d=await(await fetch(base+'info/'+group)).json();if(document.activeElement!==address)address.value=d.url==='about:blank'?'':d.url||'';}catch{}if(!stopped)setTimeout(info,2000);}info();
function go(){let url=address.value.trim();if(!/^https?:\/\//.test(url))url='https://'+url;send('Page.navigate',{url});view.focus();}
document.querySelector('#go').onclick=go;address.onkeydown=e=>{if(e.key==='Enter')go();};document.querySelector('#reload').onclick=()=>send('Page.reload',{});
function point(e){const r=view.getBoundingClientRect(),scale=Math.min(r.width/1280,r.height/720);return{x:Math.max(0,Math.min(1279,(e.clientX-r.left-(r.width-1280*scale)/2)/scale)),y:Math.max(0,Math.min(719,(e.clientY-r.top-(r.height-720*scale)/2)/scale))};}
const mods=e=>(e.altKey?1:0)|(e.ctrlKey?2:0)|(e.metaKey?4:0)|(e.shiftKey?8:0);
view.onmousedown=e=>{e.preventDefault();view.focus();send('Input.dispatchMouseEvent',{type:'mousePressed',...point(e),button:['left','middle','right'][e.button]||'left',clickCount:e.detail||1,modifiers:mods(e)});};
view.onmouseup=e=>{e.preventDefault();send('Input.dispatchMouseEvent',{type:'mouseReleased',...point(e),button:['left','middle','right'][e.button]||'left',clickCount:e.detail||1,modifiers:mods(e)});};
view.oncontextmenu=e=>e.preventDefault();let lastMove=0;view.onmousemove=e=>{if(Date.now()-lastMove<60)return;lastMove=Date.now();send('Input.dispatchMouseEvent',{type:'mouseMoved',...point(e),buttons:e.buttons,modifiers:mods(e)});};
view.addEventListener('wheel',e=>{e.preventDefault();send('Input.dispatchMouseEvent',{type:'mouseWheel',...point(e),deltaX:e.deltaX,deltaY:e.deltaY,modifiers:mods(e)});},{passive:false});
view.onkeydown=e=>{e.preventDefault();if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey)send('Input.insertText',{text:e.key});else send('Input.dispatchKeyEvent',{type:'keyDown',key:e.key,code:e.code,windowsVirtualKeyCode:e.keyCode,modifiers:mods(e),...(e.key==='Enter'?{text:'\r'}:{})});};
view.onkeyup=e=>{e.preventDefault();send('Input.dispatchKeyEvent',{type:'keyUp',key:e.key,code:e.code,windowsVirtualKeyCode:e.keyCode,modifiers:mods(e)});};
view.onpaste=e=>{e.preventDefault();send('Input.insertText',{text:e.clipboardData.getData('text')});};window.onbeforeunload=()=>stopped=true;
</script></body></html>
